<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ford Lease Overlay Tool</title>
    <style>
        /* The tile's printed labels are Segoe UI Bold (the Windows system font),
           so the numbers are drawn in the same font to match. */
        :root {
            --brand-black: #000000;
            --bg-gray: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', 'Selawik', Arial, sans-serif;
            background: var(--bg-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--brand-black);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--brand-black);
            font-size: 24px;
            font-weight: 800;
            width: 140px;
            text-align: center;
            outline: none;
        }

        button {
            background: var(--brand-black);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        canvas {
            border: 1px solid #eee;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            background-color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ford Lease Overlay Tool</h2>

    <div class="controls">
        <div class="field-group">
            <label>Weekly payment ($)</label>
            <input type="text" id="paymentInput" value="" placeholder="299" maxlength="6">
        </div>
        <div class="field-group">
            <label>Rate (%)</label>
            <input type="text" id="rateInput" value="" placeholder="2.99" maxlength="6">
        </div>
        <div class="field-group">
            <label>Term (months)</label>
            <input type="text" id="termInput" value="" placeholder="48" maxlength="3">
        </div>
        <div class="field-group">
            <label>Down payment ($)</label>
            <input type="text" id="downInput" value="" placeholder="2,500" maxlength="8">
        </div>
        <button id="downloadBtn">Download Final PNG</button>
    </div>

    <canvas id="canvas" width="1280" height="960"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    const inputs = {
        payment: document.getElementById('paymentInput'),
        rate:    document.getElementById('rateInput'),
        term:    document.getElementById('termInput'),
        down:    document.getElementById('downInput'),
    };

    // ---- Layout (measured from template.png) ----
    // All big numbers sit on the same baseline as the printed "$" signs.
    // The "$", "weekly", "%", "months" and "DOWN!*" are already printed on
    // template.png, so we only draw the numbers.
    const BASELINE   = 106;   // y of the bottom of the digits
    const BIG_SIZE   = 64;    // digit height ~45px, matches the printed "$"
    const WEIGHT     = 700;   // Segoe UI Bold, same as the tile's labels
    const FONT       = "'Segoe UI', 'Selawik', Arial, sans-serif";

    const FIELDS = {
        // Lease from $[XXX] weekly   -> number starts right after the printed "$"
        payment: { x: 65,  align: "left",  maxWidth: 135 },
        // at [X.XX]%                 -> number ends right before the printed "%"
        rate:    { x: 513, align: "right", maxWidth: 140 },
        // for [XX] months            -> number starts under "for"
        term:    { x: 630, align: "left",  maxWidth: 90  },
        // with $[X,XXX] DOWN!*       -> number starts right after the printed "$"
        down:    { x: 936, align: "left",  maxWidth: 200 },
    };

    let templateImg = new Image();
    templateImg.src = "template.png";

    let templateReady = false;
    templateImg.onload = () => { templateReady = true; draw(); };

    document.fonts.ready.then(() => { if (templateReady) draw(); });

    // Clean up what the user typed so the tile never shows "$$" or "%%".
    function clean(key, raw) {
        let v = raw.trim().replace(/[$%\s]/g, "");
        if (key === "down" && /^\d+$/.test(v)) {
            v = Number(v).toLocaleString("en-CA");        // 2500 -> 2,500
        }
        if (key === "term") v = v.replace(/[^\d]/g, "");
        return v;
    }

    // Draw text at the given size, shrinking it if it would run into the
    // printed labels. Returns the width actually drawn.
    function drawFit(text, x, align, maxWidth, size, weight) {
        let s = size;
        ctx.font = `${weight} ${s}px ${FONT}`;
        let w = ctx.measureText(text).width;
        while (w > maxWidth && s > 20) {
            s -= 1;
            ctx.font = `${weight} ${s}px ${FONT}`;
            w = ctx.measureText(text).width;
        }
        ctx.textAlign = align;
        ctx.fillText(text, x, BASELINE);
        return w;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(templateImg, 0, 0, 1280, 960);

        ctx.fillStyle = "white";
        ctx.textBaseline = "alphabetic";

        for (const key of Object.keys(FIELDS)) {
            const value = clean(key, inputs[key].value);
            if (value === "") continue;
            const f = FIELDS[key];
            drawFit(value, f.x, f.align, f.maxWidth, BIG_SIZE, WEIGHT);
        }
    }

    Object.values(inputs).forEach(el => el.addEventListener('input', draw));

    downloadBtn.addEventListener('click', () => {
        const missing = Object.keys(inputs).filter(k => inputs[k].value.trim() === "");
        if (missing.length) {
            alert("Please fill in all four fields before downloading.");
            return;
        }
        const p = clean("payment", inputs.payment.value);
        const r = clean("rate", inputs.rate.value);
        const t = clean("term", inputs.term.value);
        const d = clean("down", inputs.down.value).replace(/,/g, "");

        const link = document.createElement('a');
        link.download = `Ford_Lease_${p}wk_${r}pct_${t}mo_${d}down.png`;
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
</body>
</html>
